# Supabase CLI project config — technology-stack.md §3.7.
# Local stack (supabase start) requires Docker; CI applies migrations with
# `supabase db push` against staging (see supabase/README.md).
project_id = "simran-qc-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.mfa]
# MFA (TOTP) enforcement for QUALITY_HEAD + ADMIN lands in Phase 2
# (execution-plan.md step 2.2); max_enrolled_factors is the first knob.
max_enrolled_factors = 10

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"
