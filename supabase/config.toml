# Supabase CLI project config — technology-stack.md §3.7.
# The local Docker stack was removed; the hosted project (linked) is the single
# backend. This file still drives migration metadata + the TOTP/auth settings
# replicated there, and `npm run db:migrate` pushes to the linked project.
project_id = "simran-qc-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.mfa]
# MFA (TOTP) enforcement for QUALITY_HEAD + ADMIN lands in Phase 2
# (execution-plan.md step 2.2); max_enrolled_factors is the first knob.
max_enrolled_factors = 10

# TOTP enroll/verify default to false on the local stack — without these the
# login challenge and the enrollment dialog both fail with "MFA verification
# is disabled for TOTP", and the QH can never reach an AAL2 session (SO-01…04).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"
